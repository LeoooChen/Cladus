name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cladus-gui/package-lock.json
      - name: Frontend typecheck and build
        if: runner.os == 'Windows'
        working-directory: apps/cladus-gui
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check platform boundaries
        shell: pwsh
        run: ./scripts/check-layering.ps1
      - name: Frontend localization tests (mocked host)
        if: runner.os == 'Windows'
        working-directory: apps/cladus-gui
        run: |
          npx playwright install chromium
          npx playwright test --workers=2
          npm audit
      - name: Download pinned WinDivert
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Real WinDivert acceptance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Release
      - name: Service acceptance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-service.ps1
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        # The version comes from Cargo.toml; a release tag must match it.
        run: |
          ./scripts/package-windows.ps1
          if ('${{ github.ref }}'.StartsWith('refs/tags/v') -and -not (Test-Path "target/installer/cladus-$('${{ github.ref_name }}'.Substring(1))-windows-x64-setup.exe")) {
            throw 'The tag does not match the workspace version'
          }
      - name: Installer acceptance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows
          path: |
            target/e2e-*/acceptance.log
            target/installer-test/*.log
            target/installer/*.exe
            target/installer/SHA256SUMS

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: target
      - name: Checksums
        run: |
          cd target/installer
          sha256sum *.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/*.exe
            target/installer/SHA256SUMS
