name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check platform boundaries
        shell: pwsh
        run: ./scripts/check-layering.ps1
      - name: Download pinned WinDivert
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Real WinDivert acceptance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Release
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-acceptance
          path: |
            target/e2e-*/acceptance.log
            target/release/stemma-engine.exe
            target/release/stemma-e2e.exe

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
