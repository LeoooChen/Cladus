[workspace]
resolver = "3"
members = [
    "crates/cladus-core",
    "crates/cladus-platform-windows",
    "crates/cladus-ipc",
    "apps/cladus-engine",
    "apps/cladus-gui/src-tauri",
    "tests/e2e",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Cladus contributors"]
publish = false

[workspace.dependencies]
cladus-core = { version = "0.1.0", path = "crates/cladus-core" }
cladus-platform-windows = { version = "0.1.0", path = "crates/cladus-platform-windows" }
cladus-ipc = { version = "0.1.0", path = "crates/cladus-ipc" }

anyhow = "1.0.100"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
ipnet = "2.11"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
windows-sys = "0.61"
windows-service = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
debug = "limited"
