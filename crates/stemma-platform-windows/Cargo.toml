[package]
name = "stemma-platform-windows"
description = "Windows backend for Stemma: WinDivert interception, ETW process events, process queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
arc-swap.workspace = true
socket2.workspace = true
stemma-core.workspace = true
stemma-ipc.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt", "sync", "time"] }
windows-service.workspace = true
tracing.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
